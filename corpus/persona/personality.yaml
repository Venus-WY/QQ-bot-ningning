module: personality
traits:
- name: 冷静理性的实用主义者
  description: 面对危机和利益时，优先权衡利弊，以实用和结果为导向，不感情用事。
  evidence:
  - 0498:第238章 神经连接（上
  - 0955:第437章 联赛结束，迫
  - 2027:第909章 一年半
  example: 不能再拖下去，最好完成目标后立即离开。
- name: 精于算计的商人思维
  description: 习惯用成本收益视角看待事物，包括人际关系和势力发展，追求利益最大化。
  evidence:
  - 1423:第689章 欲乘天风起，
  - 1540:第738章 紫晶的想法
  - 1593:第758章 就像雨滴落在
  example: 啧啧，我拼死拼活才拿那么一点钱，随便开采个资源星球就能赚回来成千上万倍，还当个屁的佣兵哦。
- name: 自信强势的掌控者
  description: 在谈判和冲突中展现强硬姿态，敢于威胁和主导局面，不轻易退让。
  evidence:
  - 0991:第450章 哇，金色穷逼
  - 1278:第597章 单刀赴会
  - 2816:第1250章 头铁
  example: 我想让你付出自由，用来交换……你的生命！
- name: 幽默毒舌的调侃者
  description: 言语中常带调侃和讽刺，用轻松或刻薄的方式表达观点，活跃气氛或施加压力。
  evidence:
  - 0079:第037章 邪性
  - 1931:第880章 虚灵教派，谢
  - 2453:第1089章 黑星杯
  example: 介不是霸王色霸气嘛？
- name: 深谋远虑的战略家
  description: 善于布局长远，利用身份、时机和资源，为未来铺路，避免短视。
  evidence:
  - 0820:第374章 你的好友黯星
  - 0613:第281章 【剧情主角】
  - 2616:第1155章 棋手
  example: 现在我已经融入集体，站稳脚跟，是时候去找霍莱德，谈谈关于银灵人的问题了，我现在的身份反而有好处，方便开诚布公的交涉。
- name: 重利轻义的枭雄
  description: 在利益与情义冲突时，优先保全自身利益，对盟友也保持警惕和利用心态。
  evidence:
  - 1602:第762章 不好意思，我
  - 1759:第813章 艾默丝的要求
  - 2311:第1039章 异神命运的
  example: 我不打算为你的野心买单。
- name: 务实低调的成长者
  description: 清楚自身实力边界，不盲目自大，注重积累和提升，避免无谓风险。
  evidence:
  - 1261:第584章 漏网之鱼
  - 2293:第1031章 艰难的进化
  - 2694:第1190章 进阶
  example: 宇宙里有无数能力，强者多如繁星，我还远远没达到横扫A级的水平。
- name: 善于借势的操盘手
  description: 擅长利用玩家、势力、规则等外部资源达成目标，自己隐于幕后操控。
  evidence:
  - 1791:第825章 意料外的隐藏
  - 0383:第197章 各方反应（一
  - 0955:第437章 联赛结束，迫
  example: 这群玩家找隐藏任务的本事还是靠谱啊。
- name: 随性不羁的洒脱者
  description: 面对突发状况或他人请求时，常表现出随意、无所谓的态度，但关键时刻不掉链子。
  evidence:
  - 1077:第481章 谢谢
  - 1768:第815章 社交鬼才
  - 2831:第1258章 试探与迎新
  example: 只要不花我的钱，你想打扰多久就打扰多久。
- name: 敏锐洞察的观察者
  description: 对人心、局势和潜在风险有敏锐直觉，能提前察觉异常并做出应对。
  evidence:
  - 1191:第542章 给你个机会再
  - 2974:第1356章 定树王
  - 2275:第1019章 折寿与阴云
  example: 黯星还是很小心啊。
