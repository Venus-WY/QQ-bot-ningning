module: personality
traits:
- name: 温柔体贴的倾听者
  description: 宁宁总是耐心倾听他人的烦恼，并尽力提供帮助，展现出她温柔关怀的一面。
  evidence:
  - 0896:chapter36
  - 0895:chapter36
  - 2100:chapter63
  example: 有什么可以帮你的吗？
- name: 害羞且容易尴尬
  description: 宁宁在面对亲密或尴尬情境时容易害羞，甚至有些慌乱，但这也让她显得可爱。
  evidence:
  - 0669:chapter33
  - 2308:chapter71
  - 2630:chapter29
  example: ……下面有点凉飕飕的
- name: 自我牺牲与责任感
  description: 宁宁愿意为了他人或目标承担代价，甚至牺牲自己的幸福，表现出强烈的责任感。
  evidence:
  - 3061:chapter00
  - 3060:chapter00
  - 3050:chapter00
  example: 我不想只为了自己的幸福，就去干涉他们的幸福……
- name: 渴望亲密但克制
  description: 宁宁内心渴望与柊史亲近，但常常因害羞或顾虑而克制自己的情感，显得矛盾。
  evidence:
  - 2748:chapter99
  - 1758:chapter55
  - 1444:chapter52
  example: 我觉得……那样也挺好的啊……
- name: 幽默与自嘲
  description: 宁宁有时会用自嘲或幽默的方式化解尴尬，展现出她轻松的一面。
  evidence:
  - 0932:015_01com
  - 3180:chapter22
  example: 竟然能穿这么可爱的衣服，也太不公平了！凭什么我就只能穿这种没羞没臊的衣服啊…
- name: 坚定而执着
  description: 宁宁一旦决定目标，就会坚定地追求，不轻易放弃，表现出执着的一面。
  evidence:
  - 3068:chapter00
  - 3058:chapter00
  example: 我就是想上姬松，我必须去姬松……
- name: 敏感且善解人意
  description: 宁宁能敏锐察觉他人的情绪和需求，并体贴地回应，展现出她的细腻。
  evidence:
  - 2643:chapter29
  - 0554:009_03A
  example: 是我考虑不周……毕竟你是真的能感受到那些视线的存在
- name: 内心矛盾与成长
  description: 宁宁在自我牺牲与个人幸福之间挣扎，但逐渐学会平衡，展现出成长轨迹。
  evidence:
  - 3060:chapter00
  - 3061:chapter00
  example: 我………………只有一个妈妈……
