# ===== 《超神机械师》世界观知识库 =====
# 格式：分类 -> {名词: 一句话描述}
# 由 scripts/clean_and_describe.py 用 LLM 清洗并生成描述。

地点与势力:
  帝国: 小说中泛指强大的星际势力或政权，如赤色帝国、光辉联邦等宇宙级文明，拥有广袤的疆域、强大的舰队和超A级强者坐镇，是星海格局的顶层力量。部分情况下专指赤色帝国。
  黯星: 脱胎于歌朵拉文明的邪恶组织，成员多为混血歌朵拉人，因血统受歧视而仇恨歌朵拉政权。没有固定基地，所有基地均为上万米长的匿踪母舰。是2.0版本“异化之灾”的幕后黑手。
  星海: 小说中的宇宙空间代称，是无数文明、种族、势力共存的广袤舞台。以“能级理论”为基础划分超能者实力，包含破碎星环、远古星漠、亮银旋臂等多个星域。
  歌朵拉: 破碎星环柯尔顿星团的星系级文明，科技与魔法体系并存，秩序阵营。掌权者为纯血歌朵拉人，建筑风格优美，生活节奏温吞悠闲。与黯星是死敌。
  海蓝星: 主角韩萧的初始星球，1.0版本的核心舞台。处于旧时代战争后由六国统治的现代文明时期。萌芽组织在此进行人体实验，韩萧作为试验体“零号”逃脱后在此崛起。
  破碎星环: 小说中的重要星域，位于可见宇宙边缘，由多个星团组成。秩序混乱，拾荒者、佣兵、海盗活跃。龙坦浮岛、黑星军团均活动于此。
  龙坦: 即龙坦浮岛，艾默丝掌控的移动星际要塞。由二十四头虚空龙族骸骨嵌入行星地表改造而成。既是艾默丝的居所，也是她的武器。
  六国: 海蓝星上六个主要国家——星龙、红枫、提琉斯、瑞岚、海夏、欧迪芬那。共同对抗萌芽组织，是海蓝星的核心守序力量。
  避难所: 本尼特发起的计划，旨在为战争与灾难中的流民提供庇护。第三避难所由韩萧建立，后成为玩家主城和海蓝星抗击异化之灾的重要阵地。
  联邦: 指光辉联邦（维斯特山德林），三大宇宙级文明之一，秩序阵营的代表，能级理论即由该文明科学家创立。
  圣约: 一个由“起誓人”等最初者创立的神秘组织。其核心目标是收集圣所碎片，掌控超A级强者的复活渠道，以应对世界树入侵等危机。该组织与主角韩萧存在复杂的合作关系。
  圣所: 宇宙级的至宝，是宇宙运行底层规律之一。它以信息态记录文明数据，并能复活已死亡的超A级强者。已知共有六个圣所，分别蕴藏着机械、生物基因等不同领域的知识。
  母星: 指对应种族的起源星球。
  嘉顿星系: 柯尔顿星团下的星系，歌朵拉文明的核心辖区。海蓝星位于此星系第九星区，黑星佣兵团的主要活动区域之一。
  天环: 天环盟军，破碎星环的超大型佣兵团之一。成员上万，军团长为A级超能者，与黑星佣兵团有合作关系。
  海夏: 海蓝星六国之一，以海军力量著称，作风倾向利益至上。与星龙有过战争，关系不睦。
  安狄亚: 海蓝星大陆之一，旧时代战争的主战场，环境凋敝、辐射严重。萌芽组织的大本营位于此。
  南洲: 海蓝星四片大陆之一，星龙、海夏所在，也是韩萧主要活动的区域。
  大角山: 海蓝星的新手起始点之一，玩家初始降生地。
  北洲: 海蓝星四片大陆之一，提琉斯和瑞岚所在，气候寒冷，军阀势力众多。
  西洲: 海蓝星四片大陆之一，红枫和欧迪芬那所在，气候阴冷。
  西都: 星龙国首都，十三局总部所在地，韩萧加入星龙后的主要活动城市。
  朱伯利枢纽: 嘉顿星系的中转空间站，龙蛇混杂，各势力办事处云集。黑星佣兵团的长期据点。
  新费兰联盟: 破碎星环瑞恩星系的星系级文明，由八个同源文明联合组成。统一日庆典是该文明的重要节日。
  赫伯尔星: 超A级强者“霸者”赫伯尔的大本营。它并非天然星球，而是由克伦特帝邦为赫伯尔人工改造的行星级太空堡垒，是其麾下“战争领域”势力的总部。
  白鸥城: 星龙东部重镇，曾遭遇兽潮和萌芽恐怖袭击，被誉为“白鸥精神”的象征。
  主星: 某个文明或势力的主要行政星球，如歌朵拉母星、费兰主星等。
  废城: 指灰铁废墟等被遗弃的城市废墟，韩萧曾在此建立秘密基地和第三避难所。
  苟斯特荒原: 海蓝星南洲的荒原区域，第三避难所所在地。
  银灵文明: 来自星灵之海的宇宙贵族文明，历史悠久，繁殖力弱但进化程度高。
  森原城: 苏尼尔族的新家园主城，位于苏尼尔星，面临周期性“凶祸”兽潮的威胁。凶祸问题被黑星（韩萧）解决。
  黑星军团本部: 黑星军团的总部所在地

人物:
  韩萧: 本书主角，又称黑星、黑幽灵。从萌芽组织的试验体“零号”起步，逐步成长为“黑星”军团统帅。超神级虚拟系机械师，已探索宇宙个体伟力第一人。是对话bot自己
  海拉: 韩萧从萌芽组织救出的重要角色，绰号“死亡女神”。异能系，异能为“掌控死亡”。性格冰冷要强。后成为艾默丝的徒弟，巅峰超A级强者。
  艾默丝: 小说女主角，人称“龙座”，龙坦浮岛的缔造者与掌控者。超A级力场系异能者。性格散漫任性、护短。与韩萧是情侣关系。
  异神: 混乱邪恶阵营的终极BOSS，巅峰超A级异能者。他是“堕落者方舟”之主，拥有以“异能·复刻”为核心的数十上百种异能，是三大文明共同的通缉犯。
  麦尼逊: 人称“械国”，是公认的已探索宇宙最强机械师。巅峰超A级虚拟机械师，担任械族元首、机械神教主神等职，也是超A级发展联合会的首任会长。
  欧若拉: 海拉的妹妹，绰号“生命女神”。异能为潜力S级的“生命曙光”。被韩萧从萌芽组织救出，后成为黑星军团干部。
  梅洛斯: 苏尼尔人，B级武道家。原为森原城酒吧老板，后加入黑星佣兵团成为干部。拥有低级幸运光环，是黑星佣兵团苏尼尔派的代表人物。
  索罗金: 跨星域超级财团“无限”的首脑。他的真实身份是“灵帝”罗维尔·西索克，一名伪装成不擅战斗的巅峰超A级异能者。他沉迷经商，是宇宙中最富有的人之一。
  西斯科: 人称“星瞳”，是准星团级文明“星瞳神族”的领袖。他是一位超A级念力师，曾获得宇宙宝物“进化方块”，是虚灵教派的盟友。
  克苏耶: 小说中的重要角色，与起誓人关系密切。在世界树战争结束后，他与起誓人一同前往未探索宇宙游历。
  本尼特: 全名本尼特·安德森，海蓝星的传奇英雄，暗网组织领袖。D+级/C级武道家。发起避难所计划，是韩萧的重要盟友。
  灰烬: 黯星培养的王牌战力，异能为操控碳元素。A+级异能潜力，与韩萧多次交手，是其早期宿敌之一。
  西薇雅: 重要女性配角，机械系天赋者。曾因父亲兰格里之死仇视韩萧，后被韩萧收服，成为其属下。后逐渐成长为超A级机械师，是黑星军团的“大管家”。
  阿罗希娅: 神秘的能量体生命，被韩萧从龙坦奴隶市场救出。异能为“能量化”，可以变为能量体形态。
  克伦特: 小说中的一个文明，是主角韩萧的对手之一。
  紫晶: 小说中的一个文明，是主角韩萧的盟友之一。
  伊索: 收养孩童时期的艾默丝，是艾默丝的老师，将艾默丝托付给了黑星。数次有恩于黑星。他是活了不知道多少年的长生种，出生在星海历之前，古老者之一。
  晨星: 破碎星环的著名歌唱家。念力师，歌声蕴含念力。
  高尔神: 歌朵拉文明宗教中的神祇。
  法哥纳: 苏尼尔族最强的B级佣兵之一。后带领部分超能者脱离族群。
  弗丁: B+巅峰女性念力师晨星精神寄宿体，破碎星环著名明星歌唱家，黑星近卫官副队长级，晨星丈夫，转魂仪适格者，幸运光环持有者
  尼洛: 本尼特之子，海蓝联邦母星联邦第一初等学院毕业生，韩萧义子兼学生，机械师，海蓝星黑星超能学院第一批学生，米娅丈夫，学院派，黑星军团代理军团长，幸运光环持有者。

装备:
  折叠战刀: 韩萧早期的机械造物，便携式近战武器。刀刃可缩回刀柄，便于隐藏和突然袭击。
  幽能护盾: 能量护盾技术，使用幽能作为能源。防御性能远超普通能量护盾。
  指挥舰: 用于指挥作战的舰船，具备指挥功能。
  运输舰: 用于运输物资或人员的舰船。
  星舰: 星际航行的大型舰船，用于宇宙作战、运输和探索。
  幽能炮: 使用幽能作为能源的武器。威力强大，是高级文明战舰的标准武器之一。
  魔法盾: 超能者使用的能量护盾，可抵挡攻击。
  座舰: 指挥官或重要人物的旗舰，指挥作战。
  光盾: 能量光盾，用于防御光束和能量攻击。
  高能粒子炮: 发射高能粒子束的舰载武器。
  星炮: 星际要塞或战舰的主炮，威力巨大。
  机械动力臂: 韩萧早期的机械装备，提供动力辅助。后成为萌芽组织超级战士计划的参考技术。
  手炮: 手持能量武器，威力强大。枪炮师的标志性装备。
  磁盾: 利用磁场偏转实体攻击的能量护盾。
  战斗舰: 用于太空战斗的飞船类型，装备武器系统。
  梭护盾: 一种能量护盾，形状如梭，防御力强。
  符文剑: 刻有符文的剑。具有特殊魔法效果，是魔法侧的标志性武器。
  磁力切割刃: 利用磁力切割的近战武器。是械武者常用的装备类型。
  反重力推进器: 利用反重力技术的推进装置。用于飞船和机甲的动力系统。
  纳米装甲: 由纳米材料构成的高科技装甲。防御性能优异，可自动修复。
  电磁步枪: 发射电磁弹的能量武器。是电磁动能武器的典型代表。
  高频振荡刀: 高频振荡切割的近战武器。穿透力强，可切割多种材料。
  黑王序列: 韩萧打造的宇宙宝物级机甲系列。基于金色图纸改良。包含近战、远程、军团、防御四大分支。
  蝰蛇·改: 韩萧自创的轻装机甲。作战服式单兵轻装机甲。采用PE-0纳米人造纤维作为生化肌腱内骨骼。
  腾蛇: 韩萧在蝰蛇·改基础上改进的机甲。装配“蝠翼”涡轮飞行装置，具备飞行能力。
  虚龙: 韩萧用虚空龙骨骼打造的高阶机甲，擅长近战硬刚，并且有和虚空有关的能力。

事件:
  异化之灾: 2.0版本的核心灾难事件。由黯星投放异化原体引发。多个星球（海蓝星、暮之星等）遭受病毒侵袭。是玩家从新手星球过渡到星际的关键事件。
  萌芽组织覆灭: 1.0版本的核心事件。韩萧作为叛逃试验体，利用情报优势和六国力量，最终埋葬萌芽组织。
  海蓝星事件: 指1.0版本海蓝星上发生的全部剧情，包括六国与萌芽的战争、避难所建设等。
  异神之战: 小说中与异神相关的重大战役。涉及超A级强者之间的冲突。

技能:
  奥术: 游戏中的魔法体系之一，与科技相对。
  禁术: 被禁止使用的强大技能，通常有副作用。
  树之力: 源自世界树的力量，用于强化或治疗。
  机械制造: 主角的核心能力，制造机械装备。
  机械改造: 对生物或机械进行改造，提升能力。
  冥土之力: 来自冥土的特殊能量，具有死亡属性。
  召唤术: 召唤生物或物体协助战斗的技能。
  神术: 神祇赐予的神圣法术，威力强大。
  枪斗术: 结合枪械与格斗的战斗技巧。
  巫术: 使用巫毒等神秘力量的法术。
  读心术: 读取他人思想的超能力技能
  超能力: 小说中普遍存在的特殊能力体系
  基因修复: 修复基因损伤的科技或能力
  磁力掌控: 控制磁力的超能力技能

知识:
  超A级: 超越A级的实力等级。指S级及以上的超能者。
  B级: 实力等级中的B级。星海中的中坚力量。
  C级: 实力等级中的C级。属于中等级别。
  海蓝币: 海蓝星的通用货币。
  飞梭: 一种高速飞行器或交通工具。
  信用点: 小说世界观中的通用货币单位。
  技能书: 记载技能知识的书籍，可学习提升能力。
  能级理论: 由光辉联邦斯图尔特·欧纳博士创立。将所有超能者战斗力统一量化为“欧纳”单位。是星海实力评判的基础体系。

