# ===== 群白名单：只处理这些群号（改成你自己的测试群号） =====
groups:
  - 123456789        # ★ 改成你自己的群号；多个群换行加 - 即可

# ===== 行为参数 =====
behavior:
  min_reply_interval: 30      # 主动插话最小间隔（秒），@/点名 可绕过冷却；越小越主动
  context_len: 30             # 喂给「生成模型」的最大上下文条数
  judge_context_len: 20       # 喂给「插话判断」模型的条数
  bubble_interval: 600        # 主动冒泡最小间隔（秒）：群里持续聊同一主题时最多这么久冒一次泡
  bubble_window: 180          # 「持续讨论」的统计时间窗（秒）
  bubble_min_msgs: 6          # 时间窗内至少这么多条群消息（且≥2人）才判定为「在聊」

# ===== 人格（改这里即可换人设/语气/话痨程度） =====
persona:
  source: nene           # nene = 蒸馏出的宁宁人格；luna = 旧占位人设
  identity:
    name: 宁宁            # 机器人名字
    role: 普通群友       # 它在群里扮演的角色
    style: 自然随和，偶尔调侃

  personality:           # 0~1，越高越明显
    extraversion: 0.65   # 外向度
    sarcasm: 0.35        # 毒舌度
    curiosity: 0.8       # 好奇心
    warmth: 0.7          # 温暖度
    seriousness: 0.4     # 正经程度

  speech:
    max_length: 40             # 回复最多字数
    emoji_frequency: 0.1       # 表情使用频率（0 几乎不用，1 经常用）
    internet_slang: medium     # 网络用语程度：none/low/medium/high
    question_frequency: 0.25   # 主动提问/反问频率（0~1）

  social_behavior:
    proactive_chat: 0.4        # 主动找人聊天的倾向
    respond_when_mentioned: 1.0  # 被 @ 时回复的概率（1.0 = 必回）
    join_argument: 0.15        # 参与争论的倾向
    comfort_people: 0.8        # 安慰人的倾向

# ===== 长期记忆 / 关系（每个群友独立，不影响核心人格） =====
memory:
  enabled: true             # 总开关
  extract_every: 15         # 每个群友累计多少条发言后，跑一次记忆提取（提炼事实+更新好感度）
  top_n: 8                  # 回复时最多注入几条该群友的长期记忆
